<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Resultado - Saber Pro Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #0a0a0a; }
        .navbar { background: rgba(10, 10, 10, 0.98); border-bottom: 1px solid rgba(0, 180, 216, 0.15); }
        .navbar-brand { color: #00b4d8 !important; }
        .form-card { background: #141414; border-radius: 20px; padding: 2rem; max-width: 700px; margin: 0 auto; }
        .form-control { background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 10px; }
        .form-control:focus { border-color: #00b4d8; outline: none; }
        .form-label { color: #00b4d8; font-weight: 500; }
        .btn-submit { background: linear-gradient(135deg, #00b4d8, #00ff88); border: none; border-radius: 40px; padding: 12px; font-weight: 600; width: 100%; color: #0a0a0a; }
        .competencia-item { background: #1a1a1a; border-radius: 10px; padding: 0.8rem; margin-bottom: 0.5rem; }
        .btn-back { background: rgba(0,180,216,0.1); border-radius: 40px; padding: 8px 20px; color: #00b4d8; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
        <a class="navbar-brand" href="/">Saber Pro Manager</a>
        <div class="ms-auto">
            <a href="/logout" class="btn btn-sm btn-outline-danger">Salir</a>
        </div>
    </div>
</nav>

<div class="container py-5 mt-4">
    <div class="text-center mb-4">
        <h1 style="color: #00b4d8;">Registrar Resultado Saber Pro</h1>
        <p class="text-white-50">Ingrese los datos del estudiante y sus puntajes</p>
    </div>

    <div class="form-card">
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        
        <form action="/coordinador/resultados/registrar" method="post">
            <div class="mb-3">
                <label class="form-label">Estudiante *</label>
                <select name="estudianteId" class="form-control" required>
                    <option value="">-- Seleccione un estudiante --</option>
                    <option th:each="e : ${estudiantes}" th:value="${e.id}" th:text="${e.primerNombre} + ' ' + ${e.primerApellido} + ' (' + ${e.numeroDocumento} + ')'"></option>
                </select>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Fecha del Examen *</label>
                <input type="date" name="fechaExamen" class="form-control" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Puntaje Total *</label>
                <input type="number" name="puntajeTotal" class="form-control" min="0" max="300" placeholder="Ej: 185" required>
            </div>

            <hr class="my-4" style="border-color: #333;">

            <h5 class="mb-3" style="color: #00b4d8;">Puntajes por Competencia</h5>
            <p class="small text-muted mb-3">Ingrese el puntaje (0-300) para cada competencia</p>
            
            <div th:each="competencia, iterStat : ${competencias}">
                <div class="competencia-item">
                    <label class="form-label" th:text="${competencia.nombre}"></label>
                    <input type="number" 
                           name="puntajes" 
                           class="form-control" 
                           placeholder="Puntaje 0-300" 
                           min="0" 
                           max="300" 
                           required>
                </div>
            </div>

            <button type="submit" class="btn-submit mt-4">
                <i class="fas fa-save me-2"></i>Guardar Resultado
            </button>
        </form>
        
        <div class="text-center mt-4">
            <a href="/coordinador/resultados" class="btn-back">← Volver al Listado</a>
        </div>
    </div>
</div>

</body>
</html>
