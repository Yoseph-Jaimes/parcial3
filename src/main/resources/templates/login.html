<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Saber Pro Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #141414; border: 1px solid rgba(0, 255, 136, 0.2); border-radius: 24px; padding: 2.5rem; max-width: 450px; width: 100%; }
        .login-card h2 { color: #00ff88; font-weight: 700; }
        .form-control { background: #1a1a1a; border: 1px solid rgba(0,255,136,0.2); color: white; border-radius: 12px; padding: 12px; }
        .form-control:focus { border-color: #00ff88; box-shadow: 0 0 0 3px rgba(0,255,136,0.1); }
        .btn-login { background: linear-gradient(135deg, #00ff88, #00b4d8); border: none; border-radius: 40px; padding: 12px; font-weight: 600; width: 100%; color: #0a0a0a; }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,255,136,0.3); }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <div style="width: 70px; height: 70px; background: rgba(0,255,136,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;">
                <i class="fas fa-graduation-cap fa-2x" style="color: #00ff88;"></i>
            </div>
            <h2>Bienvenido</h2>
            <p class="text-white-50">Ingresa tus credenciales</p>
        </div>
        
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        
        <form action="/login" method="post">
            <div class="mb-3">
                <input type="text" name="numeroDocumento" class="form-control" placeholder="Número de documento" required autofocus>
            </div>
            <div class="mb-4">
                <input type="password" name="password" class="form-control" placeholder="Contraseña" required>
            </div>
            <button type="submit" class="btn-login">Iniciar Sesión</button>
        </form>
        
        <div class="text-center mt-4">
            <p class="text-white-50 small">© 2024 Saber Pro Manager</p>
        </div>
    </div>
</body>
</html>
