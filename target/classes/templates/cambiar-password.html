<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cambiar Contraseña - Saber Pro Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { 
            background: #0a0a0a; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            margin: 0;
            padding: 2rem;
        }
        
        .form-card { 
            background: #141414; 
            border: 1px solid rgba(0,255,136,0.1); 
            border-radius: 24px; 
            padding: 2rem; 
            width: 100%; 
            max-width: 450px;
            margin: 0 auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .form-control { 
            background: #1a1a1a; 
            border: 1px solid rgba(0,255,136,0.2); 
            color: white; 
            border-radius: 12px; 
            padding: 10px 15px; 
        }
        
        .form-control:focus { 
            border-color: #00ff88; 
            box-shadow: 0 0 0 3px rgba(0,255,136,0.1); 
            outline: none; 
        }
        
        .form-label { 
            color: #00ff88; 
            font-weight: 500; 
            margin-bottom: 0.5rem; 
        }
        
        .btn-submit { 
            background: linear-gradient(135deg, #00ff88, #00b4d8); 
            border: none; 
            border-radius: 40px; 
            padding: 12px; 
            font-weight: 600; 
            width: 100%; 
            color: #0a0a0a; 
            transition: all 0.3s;
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,255,136,0.3);
        }
        
        .btn-back { 
            background: rgba(0,255,136,0.1); 
            border: 1px solid rgba(0,255,136,0.2); 
            border-radius: 40px; 
            padding: 8px 20px; 
            color: #00ff88; 
            text-decoration: none; 
            transition: all 0.3s; 
            display: inline-block;
            margin-top: 1rem;
            text-align: center;
        }
        
        .btn-back:hover { 
            background: #00ff88; 
            color: #0a0a0a; 
            transform: translateY(-2px);
        }
        
        .alert {
            border-radius: 12px;
            padding: 0.75rem 1rem;
            font-size: 0.85rem;
        }
        
        .alert-success {
            background: rgba(0,255,136,0.15);
            color: #00ff88;
            border: 1px solid rgba(0,255,136,0.3);
        }
        
        .alert-danger {
            background: rgba(255,68,68,0.15);
            color: #ff8888;
            border: 1px solid rgba(255,68,68,0.3);
        }
        
        .icon-circle {
            width: 70px;
            height: 70px;
            background: rgba(0,255,136,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            border: 1px solid rgba(0,255,136,0.2);
        }
        
        .icon-circle i {
            font-size: 32px;
            color: #00ff88;
        }
        
        h2 {
            text-align: center;
            color: #00ff88;
            margin-bottom: 0.5rem;
        }
        
        .text-center {
            text-align: center;
        }
        
        .mt-3 {
            margin-top: 1rem;
        }
        
        .mt-4 {
            margin-top: 1.5rem;
        }
        
        .mb-3 {
            margin-bottom: 1rem;
        }
        
        .mb-4 {
            margin-bottom: 1.5rem;
        }
        
        .w-100 {
            width: 100%;
        }
    </style>
</head>
<body>

<div class="form-card">
    <div class="icon-circle">
        <i class="fas fa-key"></i>
    </div>
    <h2>Cambiar Contraseña</h2>
    
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    
    <form action="/cambiar-password" method="post">
        <div class="mb-3">
            <label class="form-label">Contraseña Actual</label>
            <input type="password" name="passwordActual" class="form-control" placeholder="Ingrese su contraseña actual" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Nueva Contraseña</label>
            <input type="password" name="passwordNueva" class="form-control" placeholder="Mínimo 4 caracteres" required>
        </div>
        
        <div class="mb-4">
            <label class="form-label">Confirmar Nueva Contraseña</label>
            <input type="password" name="confirmPassword" class="form-control" placeholder="Repita la nueva contraseña" required>
        </div>
        
        <button type="submit" class="btn-submit">
            <i class="fas fa-save me-2"></i>Actualizar Contraseña
        </button>
    </form>
    
    <div class="text-center mt-3">
        <a th:href="@{${session.rol == 'ADMIN' ? '/admin/dashboard' : 
                           (session.rol == 'COORDINADOR' ? '/coordinador/dashboard' : 
                           (session.rol == 'DOCENTE' ? '/docente/dashboard' : '/estudiante/dashboard'))}}" class="btn-back">
            <i class="fas fa-arrow-left me-2"></i>Volver al Dashboard
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
