<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Último Resultado - Saber Pro Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #0a0a0a; min-height: 100vh; display: flex; flex-direction: column; }
        .navbar { background: rgba(10, 10, 10, 0.98); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0, 255, 136, 0.15); padding: 0.8rem 0; }
        .navbar-brand { font-size: 1.5rem; font-weight: 800; color: #00ff88 !important; }
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content { display: none; position: absolute; right: 0; top: 45px; background: #141414; min-width: 200px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(0, 255, 136, 0.15); z-index: 1000; }
        .dropdown-content a { color: #c0c0c0; padding: 12px 16px; text-decoration: none; display: block; cursor: pointer; }
        .dropdown-content a:hover { background: rgba(0, 255, 136, 0.1); color: #00ff88; }
        .dropdown-content .divider { height: 1px; background: rgba(255, 255, 255, 0.08); margin: 5px 0; }
        .show { display: block !important; }
        .user-btn { background: rgba(0, 255, 136, 0.1); border-radius: 40px; padding: 5px 15px; cursor: pointer; }
        .user-avatar { width: 32px; height: 32px; background: linear-gradient(135deg, #00ff88, #00b4d8); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-right: 8px; }
        .user-avatar i { font-size: 18px; color: #0a0a0a; }
        .user-name { font-size: 0.85rem; font-weight: 500; color: #00ff88; }
        .footer { background: #0a0a0a; color: #6b6b6b; margin-top: auto; padding: 1.5rem 0; border-top: 1px solid rgba(255, 255, 255, 0.05); }
        .result-card { background: #141414; border: 1px solid rgba(0,255,136,0.1); border-radius: 24px; padding: 2rem; }
        .puntaje-total { font-size: 4rem; font-weight: 800; color: #00ff88; }
        .competencia-item { background: #1a1a1a; border-radius: 12px; padding: 1rem; margin-bottom: 0.5rem; }
        .btn-back { background: rgba(0,255,136,0.1); border: 1px solid rgba(0,255,136,0.2); border-radius: 40px; padding: 10px 28px; color: #00ff88; text-decoration: none; transition: all 0.3s; display: inline-block; }
        .btn-back:hover { background: #00ff88; color: #0a0a0a; transform: translateY(-2px); }
        .nivel-4 { color: #00ff88; font-weight: 700; }
        .nivel-3 { color: #00b4d8; font-weight: 700; }
        .nivel-2 { color: #ffc107; font-weight: 700; }
        .nivel-1 { color: #ff4444; font-weight: 700; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/">
            <i class="fas fa-graduation-cap me-2"></i> Saber Pro Manager
        </a>
        <div class="ms-auto">
            <div class="dropdown">
                <div class="user-btn d-flex align-items-center" onclick="toggleDropdown()">
                    <div class="user-avatar"><i class="fas fa-user"></i></div>
                    <span class="user-name" th:text="${session.usuario != null ? session.usuario.primerNombre : 'Usuario'}"></span>
                    <i class="fas fa-chevron-down ms-2" style="font-size: 12px; color: #00ff88;"></i>
                </div>
                <div id="dropdownMenu" class="dropdown-content">
                    <div class="px-3 py-2 text-muted small" th:text="${session.usuario != null ? session.usuario.email : ''}"></div>
                    <div class="divider"></div>
                    <a href="#" onclick="cerrarSesion()"><i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión</a>
                </div>
            </div>
        </div>
    </div>
</nav>

<div class="container py-5 mt-4">
    <div class="text-center mb-5">
        <h1 class="display-4 fw-bold" style="color: #00ff88;">Último Resultado</h1>
        <p class="lead text-white-50">Tu puntaje más reciente en el Saber Pro</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div th:if="${error}" class="alert alert-warning mb-4" th:text="${error}"></div>

            <div th:if="${resultado == null and error == null}" class="text-center py-5">
                <i class="fas fa-chart-line fa-4x mb-3" style="color: #6b6b6b;"></i>
                <p class="text-muted">No hay resultados registrados aún.</p>
            </div>

            <div th:if="${resultado != null}" class="result-card">
                <div class="text-center mb-4">
                    <small class="text-muted">Fecha del examen</small>
                    <h4 th:text="${#temporals.format(resultado.fechaExamen, 'dd/MM/yyyy')}" class="mb-2">-</h4>
                    <div class="puntaje-total" th:text="${resultado.puntajeTotal}">0</div>
                    <small class="text-muted">Puntaje Total</small>
                </div>

                <hr class="my-4" style="border-color: rgba(0,255,136,0.1);">

                <h5 class="mb-3" style="color: #00ff88;">Detalle por Competencia</h5>
                <div th:each="detalle : ${resultado.detalleCompetencias}">
                    <div class="competencia-item">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <strong th:text="${detalle.competencia.nombre}">-</strong>
                            </div>
                            <div>
                                <span class="me-3" th:text="${detalle.puntaje} + ' pts'">-</span>
                                <span th:class="${'nivel-' + detalle.nivel.substring(6)}" th:text="${detalle.nivel}">-</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Botón volver abajo -->
    <div class="text-center mt-5">
        <a href="/estudiante/dashboard" class="btn-back">
            <i class="fas fa-arrow-left me-2"></i>Volver al Dashboard
        </a>
    </div>
</div>

<footer class="footer py-4 mt-5">
    <div class="container text-center">
        <p class="small mb-0">&copy; 2024 Saber Pro Manager - Todos los derechos reservados</p>
    </div>
</footer>

<script>
    function toggleDropdown() {
        document.getElementById("dropdownMenu").classList.toggle("show");
    }
    function cerrarSesion() {
        window.location.href = "/logout";
    }
    window.onclick = function(event) {
        if (!event.target.closest('.dropdown')) {
            var dropdowns = document.getElementsByClassName("dropdown-content");
            for (var i = 0; i < dropdowns.length; i++) {
                dropdowns[i].classList.remove("show");
            }
        }
    }
</script>
</body>
</html>
